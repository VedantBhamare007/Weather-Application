<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eaf4fb">
    <meta name="description" content="Check current weather conditions for a city.">
    <title>Weather App</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css">
</head>
<body>
    <main class="container">
        <h1>Weather App</h1>

        <form id="weather-form" role="search">
            <label class="visually-hidden" for="inputTxt">City name</label>
            <input
                type="search"
                id="inputTxt"
                name="city"
                placeholder="Enter a city name…"
                autocomplete="off"
                spellcheck="false"
                required
            >
            <button type="submit" id="searchBtn" aria-label="Search weather">
                <i class="bx bx-search" aria-hidden="true"></i>
            </button>
        </form>

        <p id="status" class="status" role="status" aria-live="polite" hidden></p>

        <section id="weather" aria-label="Current weather" hidden>
            <img id="condition-icon" class="condition-icon" src="" alt="">
            <h2 id="temperature"></h2>
            <p id="description" class="description"></p>
            <p id="location" class="weather-detail"></p>
            <p id="feels-like" class="weather-detail"></p>
            <p id="humidity" class="weather-detail"></p>
        </section>
    </main>
    <script src="config.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
